<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="个人知识库 - 基于 Obsidian 的在线笔记阅读器">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">
  <title>个人知识库</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/lib/highlight.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header" id="appHeader">
      <div class="header-content">
        <h1 class="logo">📖 知识库</h1>
        <button id="themeToggle" class="icon-btn" aria-label="切换主题">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
      <div class="search-bar">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" placeholder="搜索笔记..." autocomplete="off">
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Loading -->
      <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <p>正在加载知识库...</p>
      </div>

      <!-- Dashboard Home -->
      <div id="dashboardView" class="hidden">
        <!-- Pinned -->
        <section id="pinnedSection" class="section hidden">
          <h2 class="section-title">📌 置顶笔记</h2>
          <div id="pinnedGrid" class="pinned-grid"></div>
        </section>

        <!-- Recent -->
        <section class="section">
          <h2 class="section-title">🕐 最近更新</h2>
          <div id="recentGrid" class="recent-grid"></div>
        </section>

        <!-- Folders -->
        <section class="section">
          <h2 class="section-title">📁 文件夹</h2>
          <div id="foldersGrid" class="folders-grid"></div>
        </section>
      </div>

      <!-- Folder Detail View -->
      <div id="folderView" class="hidden">
        <div class="breadcrumb">
          <button id="btnBack" class="back-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="15 18 9 12 15 6"></polyline></svg>
            <span>返回</span>
          </button>
          <span id="folderTitle" class="breadcrumb-title"></span>
        </div>
        <div id="folderNotesGrid" class="notes-list"></div>
      </div>
    </main>

    <!-- Floating Action Button -->
    <button id="btnNewNote" class="fab" aria-label="新建笔记">
      <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>

    <!-- Note Modal -->
    <div id="noteModal" class="modal-overlay">
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-header">
          <button id="btnCloseNote" class="icon-btn" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
          <h2 id="modalNoteTitle" class="modal-title"></h2>
          <div class="modal-actions">
            <button id="btnPinNote" class="icon-btn" aria-label="置顶">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>
            </button>
            <button id="btnEditNote" class="icon-btn" aria-label="编辑">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            <button id="btnSaveNote" class="icon-btn hidden save-btn" aria-label="保存">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </button>
          </div>
        </div>
        <div class="modal-body markdown-body" id="modalNoteContent"></div>
        <textarea id="modalNoteEditor" class="editor-textarea hidden" spellcheck="false"></textarea>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
