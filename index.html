<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>个人知识库</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <h1 class="logo">Knowledge Base</h1>
        <button id="themeToggle" class="icon-btn" aria-label="Toggle Theme">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="css-i6dzq1"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
      
      <!-- Search Bar -->
      <div class="search-container">
        <div class="search-bar">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="searchInput" placeholder="搜索笔记...">
        </div>
      </div>
    </header>

    <!-- Main Content: Folders / Notes List -->
    <main class="main-content" id="mainContent">
      <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <p>正在同步知识库...</p>
      </div>
      
      <div id="foldersContainer" class="folders-grid hidden">
        <!-- Folders will be injected here -->
      </div>

      <div id="notesContainer" class="notes-list hidden">
        <div class="breadcrumb" id="breadcrumb">
          <button id="btnBackToFolders" class="text-btn">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            返回
          </button>
          <span id="currentFolderName" class="current-folder"></span>
        </div>
        <div class="notes-grid" id="notesGrid">
          <!-- Notes will be injected here -->
        </div>
      </div>
    </main>

    <!-- Note Viewer Modal -->
    <div id="noteModal" class="modal-overlay">
      <div class="modal-sheet">
        <div class="modal-header">
          <button id="btnCloseNote" class="icon-btn">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
          <h2 id="modalNoteTitle" class="modal-title"></h2>
          <div style="width:24px"></div> <!-- Spacer -->
        </div>
        <div class="modal-body" id="modalNoteContent">
          <!-- Markdown HTML will be injected here -->
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
